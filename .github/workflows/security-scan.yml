---
# Supply-chain content scanning: runs before any release tag is cut, and on
# every PR touching module content, so what puppet-installer/puppet-console
# vendor via vendor.yaml's TOFU checksum pinning has already passed a
# content-safety check at the source. TOFU pinning proves "these are the
# same bytes I trusted last time." It says nothing about whether those
# bytes were safe to trust in the first place. This workflow is that check.
#
# Fail closed: any hit blocks the caller (PR check or release job). No
# silent skip. Reusable (workflow_call) so ci.yml and release.yml share one
# definition instead of drifting apart.
name: Supply-chain scan

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  clamav:
    name: ClamAV signature scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam

      - name: Update signatures
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet

      - name: Scan module tree
        # Every tracked file, including tasks/ (Bolt tasks can ship non-.pp
        # executables/binaries -- exactly what this control exists to see).
        # .git excluded deliberately: gitleaks (below) already covers
        # history-level content, and scanning packfile internals is noise,
        # not signal, for a malware-signature check.
        run: |
          clamscan --recursive --infected --exclude-dir='^\.git/' .

  gitleaks:
    name: gitleaks secret scan (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          version=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          # Pinned checksum for gitleaks_8.30.1_linux_x64.tar.gz -- verified
          # against gitleaks_8.30.1_checksums.txt on the release itself at
          # pin time (2026-08-21).
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree
        run: gitleaks detect --no-banner --no-git --source . --redact

      - name: Scan full git history
        run: gitleaks detect --no-banner --source . --redact

  puppet-supplychain:
    name: Puppet/Ruby/PowerShell static pattern checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run tools/supplychain/scan.sh
        run: sh tools/supplychain/scan.sh
