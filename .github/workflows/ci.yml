---
# STAGEHAND-OWNED, NOT MODULESYNC-MANAGED. This file was originally the
# stock modulesync-generated dependency-resolution-only workflow (matching
# every other split module pre-04.1-03); it has been normalized here to the
# same blocking-fan-in shape puppet-stagehand/stagehand's own ci.yml
# already proved (04.1-02), extended with patchbot's task-only/Windows-
# specific needs (04.1-03-PLAN.md Task 2, D-16). A future modulesync run
# would revert this file to the dependency-resolution-only shape -- if that
# happens, re-apply this normalization (lint/unit-test/task-tests/
# acceptance/windows-pester/security-scan/pdk-build-and-package/reference-
# drift jobs, immutable action SHAs, contents:read) the same way
# patchbot-puppet9-acceptance.yml/patchbot-security.yml's own headers
# already document for their pieces.
#
# Blocking vs experimental, per D-16: puppet7/puppet8/openvox8 are the
# real, GA collections this module declares support for (metadata.json
# requirements: puppet >= 7.0.0 < 9.0.0, openvox >= 8.0.0 < 10.0.0) and
# block the PR. puppet9 has no puppet gem yet (rubygems.org tops out at
# 8.10.0); openvox9 exists only as a beta prerelease. Both remain
# explicitly named, non-blocking, best-effort legs until a stable
# toolchain exists -- never silently folded into the required matrix, and
# never silently dropped either.
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      beaker_staging_url:
        description: |-
          URL to a staging Server to test unreleased packages.
          We will append the version to the Server and assume all packages are in the same directory.
          Only supported for AIO packages.
        required: false
        type: string
        default: 'https://artifacts.voxpupuli.org/openvox-agent'
      beaker_collection:
        description: |-
          When set to staging, we will download the packages from staging_url.
          Otherwise we will use the official repos. Supported values: puppet7, puppet8, openvox7, openvox8, staging.
          openvox9 also works here (best-effort, beta upstream) but is not one of
          voxpupuli/gha-puppet's officially documented beaker_collection values.
          When unset, we will generate a list of supported collections based on metadata.json.
        required: false
        type: string
      beaker_staging_version:
        description: |-
          The package version we want to test.
          Only used for beaker_collection = staging
        required: false
        type: string

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security
    uses: ./.github/workflows/patchbot-security.yml

  lint:
    name: Lint / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: puppet-lint + syntax + metadata-json-lint
        run: bundle exec rake validate lint metadata_lint

  unit-test:
    name: rspec-puppet (${{ matrix.label }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real, resolvable releases -- these block the PR.
          - label: "Puppet Core 7"
            gem_name: puppet
            gem_version: "~> 7.0"
            ruby_version: "3.2"
            experimental: false
          - label: "Puppet Core 8"
            gem_name: puppet
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          - label: "OpenVox 8"
            gem_name: openvox
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          # Puppet 9 has not shipped on RubyGems yet -- real leg, wired in,
          # can only start passing once Puppet 9 actually ships (see this
          # file's header and patchbot-puppet9-acceptance.yml for the real-
          # package compile-check path).
          - label: "Puppet Core 9 (experimental -- not yet released)"
            gem_name: puppet
            gem_version: "~> 9.0"
            ruby_version: "3.2"
            experimental: true
          # OpenVox 9 exists only as a pre-release -- forward-compat
          # signal, not a support commitment.
          - label: "OpenVox 9 (experimental -- pre-release)"
            gem_name: openvox
            gem_version: ">= 9.0.0.beta1"
            ruby_version: "3.2"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      CI_PUPPET_GEM_NAME: ${{ matrix.gem_name }}
      CI_PUPPET_GEM_VERSION: ${{ matrix.gem_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}

      - name: bundle install (fresh per matrix leg)
        # Each leg resolves its own gem graph for CI_PUPPET_GEM_NAME/
        # VERSION -- the committed local Gemfile.lock (gitignored, dev-
        # machine only) is never touched here.
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: rspec-puppet (catalog + task metadata/behavior contracts)
        # fixtures:prep installs .fixtures.yml's declared dependencies
        # (none currently). Scoped to classes/unit -- spec/acceptance is
        # covered by its own job below since it exercises a real
        # subprocess, not a Puppet catalog, and does not need to run once
        # per Puppet-version leg.
        run: |
          bundle exec rake fixtures:prep
          bundle exec rspec --pattern 'spec/{classes,defines,functions,hosts,unit}/**/*_spec.rb'

  acceptance:
    name: Acceptance (target-native, real subprocess)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: rspec (spec/acceptance -- real patch.sh subprocess, real jq, no Puppet-version dependence)
        run: bundle exec rspec spec/acceptance

  task-tests:
    name: Bolt task shell tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run tasks/*_test.sh and tests/*.sh
        run: |
          set -eu
          status=0
          for t in tasks/*_test.sh tests/*.sh; do
            [ -f "$t" ] || continue
            echo "== $t =="
            sh "$t" || status=1
          done
          exit "$status"

  # STAGEHAND-OWNED. D-15 requires the complete supported Pester suite to
  # pass on a real Windows x86_64 runner before Patchbot is releasable --
  # static inspection, a partial pass, or a macOS-native run are explicitly
  # NOT sufficient evidence. Blocking: no continue-on-error, no
  # experimental carve-out.
  windows-pester:
    name: Windows Pester (patch.ps1, native x64, D-15)
    needs: lint
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Pester (5.9.0)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Invoke-Pester -- complete supported suite must fully pass, no waivers
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.9.0 -Force
          $result = Invoke-Pester -Path ./spec/tasks/patch.Tests.ps1 -CI -PassThru
          if ($result.FailedCount -gt 0) {
            Write-Error "Pester reported $($result.FailedCount) failing case(s) on native Windows x64 -- D-15 forbids waiving any."
            exit 1
          }

  # STAGEHAND-OWNED. FORGE-01: `pdk build` packages metadata.json + the
  # module's declared files into an installable tarball independent of
  # `pdk validate`'s compatibility gate (see reference-drift job's sibling
  # note below on why `pdk validate` itself is NOT wired in here yet).
  # Inspects the resulting tarball's name/version/file manifest so a
  # malformed or incomplete package fails CI instead of only surfacing at
  # publish time.
  pdk-build-and-package:
    name: PDK build + package inspection (FORGE-01)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PDK (apt.puppet.com, sha256-pinned repo package)
        run: |
          set -euo pipefail
          curl -fsSL https://apt.puppet.com/puppet-tools-release-noble.deb -o /tmp/puppet-tools-release.deb
          echo "9c077ffd3a3c1802d04f3623dfcb8eb0ae7486fe29f2053a2ce9aa1cc3b59383  /tmp/puppet-tools-release.deb" | sha256sum -c -
          sudo dpkg -i /tmp/puppet-tools-release.deb
          sudo apt-get update
          sudo apt-get install -y pdk=3.4.0.1-1noble

      - name: pdk build
        run: pdk build --force

      - name: Inspect built package (name, version, expected file manifest)
        run: |
          set -eu
          name=$(jq -r '.name' metadata.json)
          version=$(jq -r '.version' metadata.json)
          pkg="pkg/${name}-${version}.tar.gz"
          [ -f "$pkg" ] || { echo "::error::expected package not found: $pkg"; exit 1; }
          echo ">>> package: $pkg"
          sha256sum "$pkg"
          echo ">>> manifest:"
          tar tzf "$pkg" | sed -n '1,50p'
          tar tzf "$pkg" | grep -q "${name}-${version}/metadata.json" \
            || { echo "::error::package is missing metadata.json at its expected path"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/tasks/patch.json" \
            || { echo "::error::package is missing tasks/patch.json"; exit 1; }

  # POLISH-03: REFERENCE.md must be generated, committed, and never allowed
  # to silently drift from the manifests/tasks it documents.
  reference-drift:
    name: REFERENCE.md drift gate (POLISH-03)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Regenerate REFERENCE.md and fail on drift
        run: |
          bundle exec puppet strings generate --format markdown
          git diff --exit-code -- REFERENCE.md

  package-resolution:
    name: ${{ matrix.collection }} dependency resolution
    strategy:
      fail-fast: false
      matrix:
        collection:
          - puppet7
          - puppet8
          - openvox8
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      rubocop: false
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: ${{ inputs.beaker_collection || matrix.collection }}
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  # Best-effort/beta: openvox9 has a real gem (through 9.0.0.pre.beta2) and a
  # real (beta) apt/yum repo, but upstream OpenVox itself calls that repo
  # "beta" and voxpupuli/gha-puppet's beaker.yml@v4 does not document
  # openvox9 as a supported `beaker_collection` value. Kept OUT of the
  # required `package-resolution` matrix above; promote once gha-puppet
  # documents openvox9 and/or upstream OpenVox calls openvox9 GA.
  #
  # `continue-on-error` is NOT a valid key on a job that calls a reusable
  # workflow via `uses:` (confirmed with actionlint), so "best-effort" is
  # enforced via the always-succeeding `openvox9-beta-gate` job instead --
  # any required branch-protection check should point at the gate, not at
  # openvox9-beta itself.
  openvox9-beta:
    name: openvox9 dependency resolution (beta, best-effort)
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      rubocop: false
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: openvox9
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  openvox9-beta-gate:
    name: openvox9 dependency resolution (beta, best-effort) gate
    needs: openvox9-beta
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result without failing CI
        env:
          RESULT: ${{ needs.openvox9-beta.result }}
        run: |
          set -euo pipefail
          echo "openvox9-beta result: ${RESULT}"
          echo "This gate always succeeds -- openvox9 is best-effort/beta and never blocks CI."
