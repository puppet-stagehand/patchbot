---
# Release gate for puppet-stagehand/patchbot (D-11/D-12/D-14/D-16/D-18).
# GitHub has no server-side hook to reject a `git push --tags` outright --
# the achievable gate is "the tag exists, but nothing gets published as a
# release, and the workflow run is a loud red X" -- so a pushed tag with no
# corresponding GitHub Release means it did not pass this gate, not that a
# step was forgotten. Mirrors puppet-stagehand/stagehand's release.yml
# (04.1-02) and extends it with an attached, checksummed package build --
# D-18 requires release evidence to record the SHA-256/source-commit/
# toolchain mapping from each artifact to its release, which needs a real
# built artifact on the release, not release notes alone.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  security-scan:
    name: Security (release gate)
    uses: ./.github/workflows/patchbot-security.yml

  build-package:
    name: Build + checksum package
    needs: security-scan
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: pdk build
        id: build
        run: |
          set -eu
          pdk build --force
          name=$(jq -r '.name' metadata.json)
          version=$(jq -r '.version' metadata.json)
          pkg="${name}-${version}.tar.gz"
          [ -f "pkg/${pkg}" ] || { echo "::error::expected package not found: pkg/${pkg}"; exit 1; }
          sha256sum "pkg/${pkg}" > "pkg/${pkg}.sha256"
          echo "package_name=${pkg}" >> "$GITHUB_OUTPUT"

      # NOT YET PINNED to a reviewed commit SHA: this agent has no network
      # access in this session to verify a real, current
      # actions/upload-artifact release SHA, and committing an
      # unverified/guessed SHA is worse than an honest floating tag (a
      # wrong pin either breaks the build outright or, worse, silently
      # resolves to unintended content). Re-pin to a reviewed SHA in the
      # same change that arms this workflow for a real push, per D-16 and
      # this repo's own patchbot-puppet9-acceptance.yml precedent for
      # actions the agent could not independently verify.
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            pkg/${{ steps.build.outputs.package_name }}
            pkg/${{ steps.build.outputs.package_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # NOT YET PINNED -- same rationale as upload-artifact above.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg

      - name: Create release (attaches built package + checksum, D-18)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            pkg/${{ needs.build-package.outputs.package_name }}
            pkg/${{ needs.build-package.outputs.package_name }}.sha256
